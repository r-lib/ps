on:
  workflow_dispatch:

name: s390x.yaml

jobs:
  s390x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: r-hub/actions/ctr-start@02be5ffbeae2b0d553da66acded089da11a1fb8f # v1.8.1
        with:
          image: ghcr.io/r-hub/containers/s390x
          platform: linux/s390x
          ctr-name: s390x

      - name: Test R in container
        run: |
          getRversion()
          R.version[["platform"]]
        shell: Rscript {0}

      - uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2-branch
        with:
          pak-version: none
          cache-version: s390x-1
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2-branch
        with:
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          upload-results: never
          upload-snapshots: false
        env:
          NOT_CRAN: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: ${{ format('{0}-{1}-results', runner.os, runner.arch) }}
          path: check
